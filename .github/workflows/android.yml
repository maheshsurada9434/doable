name: Android build

# Builds the Android app on every push to main.
# Forked this repo? Open the Actions tab and enable workflows. That's it:
# each push gives you a downloadable APK under Releases.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'store/**', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build app
        id: build
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          bash scripts/ci-build.sh 2>&1 | tee build.log

      - name: Publish release with the APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION-build${{ github.run_number }}"
          if [ "${{ steps.build.outputs.signed }}" = "1" ]; then
            NOTE="Signed release build. Download **doable.apk** on your Android phone to install. **doable.aab** is ready for Google Play."
            FILES="dist/doable.apk dist/doable.aab"
          else
            NOTE="Test build (installs as \"Doable (test)\"). Download **doable.apk** on your Android phone to install. Add signing secrets to get a signed release build. See CUSTOMIZE.md."
            FILES="dist/doable.apk"
          fi
          gh release create "$TAG" $FILES dist/build-info.txt --title "Doable $VERSION (build ${{ github.run_number }})" --notes "$NOTE" --target "${{ github.sha }}" --latest
          # Keep only the 5 newest builds
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' | while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag || true
          done

      # Also push the files to the "builds" branch (handy for scripts that fetch with git).
      - name: Publish to builds branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp dist/* /tmp/out/ 2>/dev/null || true
          tail -n 400 build.log > /tmp/out/build-log.txt 2>/dev/null || true
          echo "${{ job.status }} run ${{ github.run_number }} commit ${{ github.sha }}" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q -b builds
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Build ${{ github.run_number }} (${{ job.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
